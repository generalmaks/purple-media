<div style="display: flex; height: 600px; border: 1px solid #ccc;">
  <div style="width: 250px; border-right: 1px solid #ccc; display: flex; flex-direction: column;">
    <h3 style="padding: 10px; margin: 0;">Your chats</h3>

    <div style="flex: 1 1 auto; overflow-y: auto;">
      <div *ngFor="let chat of chats"
           (click)="selectChat(chat)"
           style="padding: 8px; cursor: pointer; border-bottom: 1px solid #eee;"
           [style.background]="selectedChat?.otherUserId === chat.otherUserId ? '#f0f0f0' : ''">
        {{ chat.otherUserUsername }}
      </div>
    </div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column;">
    <div *ngIf="selectedChat"
         style="flex: 1 1 auto; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
      <div *ngFor="let msg of selectedChatMessages"
           style="padding: 8px 12px; border-radius: 8px; max-width: 70%; background-color: #f5f5f5;"
           [style.alignSelf]="msg.senderId === currentUser.id ? 'flex-end' : 'flex-start'">
        <div style="font-weight: bold; margin-bottom: 2px;">
          {{ msg.senderId === currentUser.id ? 'You' : selectedChat.otherUserUsername }}:
        </div>
        <div>{{ msg.content }}</div>
        <div style="font-size: 0.75rem; color: #888; text-align: right; margin-top: 2px;">
          {{ msg.messageSent | date:'MMM d, HH:mm' }}
        </div>
      </div>
    </div>
    <div *ngIf="selectedChat" style="display: flex; padding: 10px; border-top: 1px solid #ccc;">
      <input [(ngModel)]="newMessage"
             placeholder="Type a message"
             style="flex: 1; padding: 5px;"/>
      <button (click)="send()" style="margin-left: 10px;">Send</button>
    </div>
  </div>
</div>
