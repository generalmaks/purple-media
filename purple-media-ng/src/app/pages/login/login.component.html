<div id=loginForm>
<h2>Login</h2>
<form (ngSubmit)="submit()">
  <label>Username:</label>
  <input type="text" [(ngModel)]="login().username" name="username" required />

  <label>Password:</label>
  <input type="password" [(ngModel)]="login().unhashedPassword" name="password" required />

  <button type="submit">Login</button>
</form>
  <h3>Don't have an account?</h3>
  <button (click)="toRegisterPage()" id="toRegister">Register</button>
</div>
