<div class="app-header">
  <img id="logo" alt="LOGO">
  <div id="search">
    <button id="cancelSearch">❌</button>
    <input [(ngModel)]="searchQuery" id="searchBar" type="search" placeholder="Type to search...">
    <button id="searchButton" (click)="search()">🔍</button>
  </div>
  <div id="login-controls">
    <button class="button" (click)="onLoginLogout()">{{ this.authService.isLoggedIn() ? "Logout" : "Login"}}</button>
  </div>
</div>
