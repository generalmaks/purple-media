<article class="tweet">
  <header class="tweet-header">
    <a class="author-link">
      <img
        [src]="pfpAttachment?.url ? apiUrl + pfpAttachment!.url : 'assets/default-pfp.jpg'"
        id="profile-picture"
        alt="PFP"
        (click)="toUserProfile()"
      />
      <h3>{{ user?.username}}</h3>
      <p>{{isCurrentUserFollowingAuthorBool ? "Following" : ""}}</p>
    </a>
  </header>

  <section class="tweet-content">
    <p>{{ tweet.content }}</p>
  </section>

  <section class="tweet-attachments"
           [ngClass]="'count-' + attachments.length">
    @for (att of attachments; track att.id) {
      @if (isImage(att)) {
        <img
          [src]="apiUrl + att.url"
          alt="Tweet Attachment"
          class="att-img"
        />
      }
    }
  </section>


  <footer class="tweet-footer">
    <time [attr.datetime]="tweet.createdAt">
      {{ tweet.createdAt | date : "medium" }}
    </time>
    <nav class="response-info" aria-label="Tweet actions">
      <button (click)="likePost()">❤️{{likesAmount}}</button>
      <button (click)="toResponses()">💬{{responsesAmount}}</button>
    </nav>
  </footer>
</article>
