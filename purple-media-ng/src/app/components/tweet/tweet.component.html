<article class="tweet">
  <header class="tweet-header">
    <a class="author-link">
      <img
        id="profile-picture"
        alt="PFP"
        (click)="toUserProfile()"
      />
    </a>
  </header>

  <section class="tweet-content">
    <p>{{ tweet.content }}</p>
  </section>

  @for (att of attachments; track att.id) {
    @if (isImage(att)) {
      <img
        [src]="apiUrl + att.url"
        alt="Tweet Attachment"
        width="300"
        height="300"
        class="tweet-image">
    }
  }
  <p>Attachments count: {{ attachments.length }}</p>
  <p>Id: {{ tweet.id }}</p>

  <footer class="tweet-footer">
    <time [attr.datetime]="tweet.createdAt">
      {{ tweet.createdAt | date : "medium" }}
    </time>
    <nav class="response-info" aria-label="Tweet actions">
      <button>❤️ LIKES</button>
      <button>💬 RESPONSES</button>
    </nav>
  </footer>
</article>
