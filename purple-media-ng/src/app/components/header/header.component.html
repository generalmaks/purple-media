<header class="app-header">
  <a (click)="toMainPage()" class="logo-link" aria-label="Home">
    <img src="assets/logo.png" id="logo" alt="App Logo" />
  </a>

  <form class="search-form" (ngSubmit)="search()" role="search" aria-label="Site search">
    <label for="searchBar" class="visually-hidden">Search</label>
    <input
      id="searchBar"
      [(ngModel)]="searchQuery"
      name="searchQuery"
      type="search"
      placeholder="Type to search..."
    />
    <button type="submit" id="searchButton">🔍</button>
  </form>

  <nav id="login-controls" aria-label="User actions">
    <p> {{ authService.isLoggedIn() ? this.authService.getUsername() : "Not logged in" }}</p>
    <button class="button" (click)="onLoginLogout()">
      {{ authService.isLoggedIn() ? "Logout" : "Login" }}
    </button>
  </nav>
</header>
