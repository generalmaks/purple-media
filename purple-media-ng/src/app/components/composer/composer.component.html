<section class="composer" aria-label="Create a new post">
  <form (ngSubmit)="submitPost()" #f="ngForm">

    <textarea
      id="postContent"
      [(ngModel)]="postContent"
      name="postContent"
      placeholder="What's on your mind?"
      required
      minlength="3"
      maxlength="300"
      #contentCtrl="ngModel"
    ></textarea>

    <!-- Validation errors -->
    <div class="error" *ngIf="contentCtrl.invalid && contentCtrl.touched">
      <p *ngIf="contentCtrl.errors?.['required']">Post cannot be empty</p>
      <p *ngIf="contentCtrl.errors?.['maxlength']">Max length is 500</p>
    </div>

    <div class="attachments-preview" *ngIf="selectedFiles !== undefined && selectedFiles.length > 0">
      <p>Files:</p>
      <ul>
        <li *ngFor="let f of selectedFiles">{{ f.name }}</li>
      </ul>
    </div>

    <div class="composer-actions">
      <input type="file" hidden multiple #fileInput (change)="onFilesSelected($event)">
      <button type="button" class="btn" (click)="fileInput.click()">Files</button>

      <button type="submit" class="btn" [disabled]="f.invalid || isSubmitting">
        {{ isSubmitting ? 'Posting...' : 'Post' }}
      </button>
    </div>
  </form>
</section>
