<section class="composer" aria-label="Create a new post">
  <form>
    <label for="postContent" class="visually-hidden">Write your post</label>
    <textarea
      id="postContent"
      [(ngModel)]="postContent"
      name="postContent"
      placeholder="What's on your mind?"
      required
    ></textarea>

    <div class="composer-actions">
      <button type="button" class="btn" id="attachments">Files</button>
      <button
        type="button"
        class="btn"
        id="visibility"
      >
        {{ visibility }}
      </button>
      <button type="submit" class="btn" id="post">Post</button>
    </div>
  </form>
</section>
